name: Reliab Quality Gate & CI/CD Pipeline

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  reliab-gate:
    name: Build, Test & Reliab Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Platform Dependencies & Verification
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml]" pytest pytest-asyncio pytest-cov httpx
          python -c "import rag_platform; import alembic; print('Platform dependencies verified successfully.')"

      - name: Initialize Database (Alembic Migrations)
        run: |
          python -c "import alembic.config; alembic.config.main(argv=['upgrade', 'head'])"

      - name: Prepare Test Output Directory
        run: |
          mkdir -p test-results

      - name: Run Unit & Integration Tests
        run: |
          pytest tests/ -v --junit-xml=test-results/unit-tests.xml

      - name: Platform Self-Test: Evaluator & Synthetic Quality Gate Verification
        run: |
          python -m rag_platform.gate \
            --bootstrap \
            --adapter-type synthetic \
            --project proj_ci \
            --dataset ds_ci_benchmark \
            --system-version ${{ github.sha }} \
            --policy prod-default \
            --junit-xml test-results/reliab-gate.xml

      - name: Upload Test and Gate Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliab-evaluation-reports
          path: test-results/
          if-no-files-found: ignore

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        continue-on-error: true
        with:
          files: "test-results/**/*.xml"


