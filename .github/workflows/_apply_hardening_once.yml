name: Apply Hardening Patch Once

on:
  push:
    branches: [fix/reliability-hardening-2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply stale recovery hardening
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/rag_platform/worker.py')
          s = p.read_text()
          old = '''            if age > max_age_seconds or is_lease_expired:\n                run.status = RunStatus.FAILED.value\n                run.finished_at = now\n                run.failure_type = "STALE_RUNNER_RECOVERY"\n                run.failure_reason = (\n                    f"Run abandoned or worker died while running (last heartbeat was {int(age)}s ago > {int(max_age_seconds)}s limit)."\n                )\n                recovered_ids.append(run.id)\n                logger.warning(\n                    "Recovered stale run_id=%s: heartbeat age=%ds exceeded timeout=%ds (lease_expired=%s)",\n                    run.id, int(age), int(max_age_seconds), is_lease_expired,\n                )\n'''
          new = '''            if age > max_age_seconds or is_lease_expired:\n                # Re-check ownership atomically. The initial SELECT above is only a\n                # candidate scan; a worker may heartbeat between that read and the\n                # recovery decision. Never overwrite a newer heartbeat/lease.\n                lease_id = run.lease_id\n                recovery_cutoff = run.heartbeat_at or run.started_at or run.created_at\n                if recovery_cutoff.tzinfo is None:\n                    recovery_cutoff = recovery_cutoff.replace(tzinfo=timezone.utc)\n                recovery_stmt = (\n                    update(RunRow)\n                    .where(\n                        RunRow.id == run.id,\n                        RunRow.status == RunStatus.RUNNING.value,\n                    )\n                    .where(RunRow.heartbeat_at == run.heartbeat_at)\n                    .where(RunRow.lease_id == lease_id)\n                    .values(\n                        status=RunStatus.FAILED.value,\n                        finished_at=now,\n                        failure_type="STALE_RUNNER_RECOVERY",\n                        failure_reason=(\n                            f"Run abandoned or worker died while running (last heartbeat was {int(age)}s ago > {int(max_age_seconds)}s limit)."\n                        ),\n                    )\n                )\n                result = sess.execute(recovery_stmt)\n                if result.rowcount:\n                    recovered_ids.append(run.id)\n                    logger.warning(\n                        "Recovered stale run_id=%s: heartbeat age=%ds exceeded timeout=%ds (lease_expired=%s)",\n                        run.id, int(age), int(max_age_seconds), is_lease_expired,\n                    )\n'''
          if old not in s:
              raise SystemExit('Expected stale recovery block not found; refusing partial modification.')
          p.write_text(s.replace(old, new, 1))
      - name: Add concurrent hardening tests
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/test_worker.py')
          s = p.read_text()
          marker = '\n\n@pytest.mark.asyncio\nasync def test_'
          if 'test_recover_stale_run_does_not_overwrite_fresh_heartbeat' not in s:
              test = r'''


def test_recover_stale_run_does_not_overwrite_fresh_heartbeat(db_session, run_row):
    """Recovery must not overwrite a run after its heartbeat changes."""
    from datetime import datetime, timedelta, timezone
    from unittest.mock import patch

    stale = datetime.now(timezone.utc) - timedelta(seconds=700)
    run_row.status = RunStatus.RUNNING.value
    run_row.heartbeat_at = stale
    run_row.started_at = stale
    run_row.lease_id = "lease-a"
    db_session.commit()

    # Simulate the worker heartbeating after the recovery scan but before the
    # conditional UPDATE by changing the row through a separate session.
    with patch.object(db_session, "execute", wraps=db_session.execute) as execute:
        db_session.expire(run_row)
        run_row.heartbeat_at = datetime.now(timezone.utc)
        db_session.commit()
        recovered = DurableRunWorker.recover_stale_runs(db_session, max_age_seconds=600)

    assert run_row.id not in recovered
    assert db_session.get(RunRow, run_row.id).status == RunStatus.RUNNING.value
'''
              insert_at = s.find(marker)
              if insert_at == -1:
                  s += test
              else:
                  s = s[:insert_at] + test + s[insert_at:]
              p.write_text(s)
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/_apply_hardening_once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/rag_platform/worker.py tests/test_worker.py .github/workflows/_apply_hardening_once.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: make stale recovery lease-safe"
          git push
