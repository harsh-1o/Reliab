name: "Reliab Quality Gate & CI/CD Pipeline"

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ '**' ]

jobs:
  reliab-gate:
    name: Build, Test & Reliab Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Platform Dependencies from Lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
          python -c "import rag_platform; import alembic; print('Platform dependencies verified successfully.')"

      - name: Lint (Ruff)
        run: |
          ruff check src/ tests/ --output-format=github

      - name: Type Check (mypy)
        run: |
          mypy src/rag_platform/

      - name: Verify Schema Consistency (Alembic)
        run: |
          python -c "import alembic.config; alembic.config.main(argv=['upgrade', 'head'])"
          python -c "import alembic.config; alembic.config.main(argv=['check'])"

      - name: Prepare Test Output Directory
        run: |
          mkdir -p test-results

      - name: Run Unit & Integration Tests
        run: |
          pytest tests/ -v --junit-xml=test-results/unit-tests.xml

      - name: "Platform Self-Test: Passing Quality Gate"
        run: |
          python -m rag_platform.gate \
            --bootstrap \
            --adapter-type synthetic \
            --project proj_ci \
            --dataset ds_ci_benchmark \
            --system-version ${{ github.sha }} \
            --policy prod-default \
            --mock-mode PERFECT \
            --junit-xml test-results/reliab-gate-pass.xml

      - name: "Platform Self-Test: Failing Quality Gate"
        run: |
          set +e
          python -m rag_platform.gate \
            --bootstrap \
            --adapter-type synthetic \
            --project proj_ci_fail \
            --dataset ds_ci_benchmark_fail \
            --system-version ${{ github.sha }} \
            --policy prod-default \
            --mock-mode HALLUCINATING \
            --junit-xml test-results/reliab-gate-fail.xml
          exit_code=$?
          if [ "$exit_code" -ne 1 ]; then
            echo "Expected the failing quality gate to exit 1, got $exit_code"
            exit 1
          fi
          echo "Failing quality gate correctly exited 1."

      - name: Upload Test and Gate Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliab-evaluation-reports
          path: test-results/
          if-no-files-found: ignore

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        continue-on-error: true
        with:
          files: |
            test-results/unit-tests.xml
            test-results/reliab-gate-pass.xml
