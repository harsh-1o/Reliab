[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reliab"
version = "0.2.0rc1"
description = "Reliab: Developer infrastructure for testing, failure diagnosis, and release gating for RAG & LLM systems"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Platform Team" }
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn>=0.20.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.12.0,<2.0.0",
    "httpx>=0.24.0,<1.0.0",
    "httpcore>=1.0.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1.0,<4.0.0",
]
ml = [
    "numpy>=1.24.0,<2.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
]
dev = [
    "pytest>=7.0.0,<9.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.0.0,<6.0.0",
]

[project.scripts]
reliab-worker = "rag_platform.worker:main"
reliab-gate = "rag_platform.gate:main"
rag-platform-worker = "rag_platform.worker:main"
rag-platform-gate = "rag_platform.gate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle errors + pyflakes; W: warnings; I: isort
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # Line too long — codebase uses up to 120 chars, enforced by line-length above
    "E402",  # Module-level import not at top — evaluators.py has a conditional import block
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Realistic strictness: catch genuine undefined names and import errors
# without enabling strict mode on a partially-typed codebase
warn_unused_ignores = false
no_implicit_optional = false
check_untyped_defs = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Third-party ORM/framework modules that lack complete stubs
module = [
    "sqlalchemy.*",
    "alembic.*",
    "fastapi.*",
    "starlette.*",
    "pydantic.*",
    "httpx.*",
    "uvicorn.*",
    "sklearn.*",
    "numpy.*",
    "scipy.*",
]
ignore_errors = true

# Baseline static typing configured for application modules
