name: RAG Reliability Quality Gate & CI/CD Pipeline

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  rag-gate:
    name: Build, Test & Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Platform Dependencies & Verification
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml]" pytest pytest-asyncio pytest-cov httpx
          python -c "import rag_platform; import alembic; print('Platform dependencies verified successfully.')"

      - name: Initialize Database (Alembic Migrations)
        run: |
          python -m alembic upgrade head

      - name: Run Unit & Integration Tests
        run: |
          pytest tests/ -v --junit-xml=test-results/unit-tests.xml

      - name: Seed Benchmark & Execute RAG Quality Gate (Fail-Closed)
        run: |
          python -m rag_platform.gate \
            --bootstrap \
            --project proj_ci \
            --dataset ds_ci_benchmark \
            --system-version ${{ github.sha }} \
            --policy prod-default \
            --junit-xml test-results/rag-gate.xml

      - name: Upload Test and Gate Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-evaluation-reports
          path: test-results/

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "test-results/**/*.xml"

