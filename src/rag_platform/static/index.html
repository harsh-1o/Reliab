<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reliab | RAG Reliability & Release Engineering</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon.png">
    <link rel="shortcut icon" href="/static/brand/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css?v=2.2.0">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-brand">
            <a href="/dashboard" class="brand-link" aria-label="Reliab Dashboard">
                <img src="/static/brand/reliab-logo.png" alt="Reliab" class="brand-logo" width="38" height="30">
                <h1 class="brand-name">Reliab</h1>
            </a>
            <div class="header-meta">
                <span class="header-subtitle">Release Console</span>
            </div>
            <span class="badge-env">CI Gate</span>
            <span id="repro-badge" class="chip chip-neutral" style="display:none;"></span>
        </div>
        <div class="header-controls">
            <div class="control-group">
                <label for="run-select" class="sr-only">Select Evaluation Run</label>
                <select id="run-select" class="btn" onchange="loadSelectedRun()">
                    <option value="">Loading Evaluation Runs...</option>
                </select>
            </div>
            <button class="btn" onclick="promptApiKey()" aria-label="Configure API Key">API Key</button>
            <button class="btn" onclick="logout()" aria-label="Sign Out">Sign Out</button>
            <button class="btn" onclick="refreshDashboard()" aria-label="Refresh Dashboard">Refresh</button>
            <button class="btn btn-primary" onclick="triggerSeedRun()" aria-label="Run Benchmark">Run Benchmark</button>
        </div>
    </header>

    <!-- Main Container: Populated Dynamically -->
    <main id="app-root">
        <div class="empty-state">
            <h4>Loading System State...</h4>
            <p>Connecting to datastore and retrieving evaluation runs.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="footer-left">
            <span>Reliab — Evaluation, diagnosis & quality gates for RAG systems</span>
        </div>
        <div class="footer-right">
            <a href="/docs" target="_blank" rel="noopener">API Docs</a>
            <span class="sep">•</span>
            <a href="https://github.com/harsh-1o/reliab" target="_blank" rel="noopener">GitHub</a>
        </div>
    </footer>

    <script src="/static/app.js?v=2.2.0"></script>
</body>
</html>
