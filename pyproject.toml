[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reliab"
version = "0.1.0"
description = "Reliab: Developer infrastructure for testing, failure diagnosis, and release gating for RAG & LLM systems"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Platform Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ml = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
reliab-worker = "rag_platform.worker:main"
reliab-gate = "rag_platform.gate:main"
rag-platform-worker = "rag_platform.worker:main"
rag-platform-gate = "rag_platform.gate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
